<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matthieu's Graduation</title>
  <link rel="stylesheet" href="next.css">
</head>
<body>
  <div class="container">
    <img src="land.gif" class="background" alt="Game Background">

    <div class="info-box">
      <h1>Matthieu's Graduation </h1>
      <p><strong>Date:</strong> 16th December 2025</p>
      <p><strong>Time:</strong> 11:30 AM</p>
      <p><strong>Location:</strong> Robert Blackwood Hall, Monash University, Clayton Campus</p>

      <hr>

      <h2> Countdown</h2>
      <div class="countdown">
        <div><span id="days">0</span><br>Days</div>
        <div><span id="hours">0</span><br>Hours</div>
        <div><span id="minutes">0</span><br>Minutes</div>
        <div><span id="seconds">0</span><br>Seconds</div>
      </div>

      <hr>

      <h2> Add to Calendar</h2>
      <div class="calendar-buttons">
        <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Matthieu's+Graduation&dates=20251216T030000Z/20251216T060000Z&details=Celebrate+Matthieu's+graduation!&location=Monash+University,+Clayton+Campus" target="_blank" class="btn google">+ Google Calendar</a>

        <!-- <a href="graduation.ics" class="btn ics" download>+ .ICS File</a> -->
      </div>

      <p class="thankyou">Thank you for being part of my journey </p>
    </div>
  </div>

  <script src="next.js"></script>
</body>
</html>
